[package]
name = "allama-examples"
description = "Runnable examples and live tests for allama providers"
publish = false
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
allama = { workspace = true, features = ["extract"] }
allama-anthropic = { path = "../allama-anthropic" }
allama-gemini = { path = "../allama-gemini" }
allama-openai = { path = "../allama-openai" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["rustls"] }
